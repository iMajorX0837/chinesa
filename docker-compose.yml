name: chinesa

services:
  app:
    build: .
    container_name: chinesa-app
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-china}
      DB_PASS: ${DB_PASS:-china}
      DB_NAME: ${DB_NAME:-china}
    networks:
      - default
      - venuznet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: chinesa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-china}
      MYSQL_USER: ${DB_USER:-china}
      MYSQL_PASSWORD: ${DB_PASS:-china}
      TZ: America/Sao_Paulo
    volumes:
      - china_db:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  china_db:

networks:
  venuznet:
    external: true
    name: venuz-platform_venuznet
