name: chinesa

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-china}
      DB_PASS: ${DB_PASS:-china}
      DB_NAME: ${DB_NAME:-china}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-china}
      MYSQL_USER: ${DB_USER:-china}
      MYSQL_PASSWORD: ${DB_PASS:-china}
      TZ: America/Sao_Paulo
    volumes:
      - china_db:/var/lib/mysql
      - ./china_full.sql:/docker-entrypoint-initdb.d/01-china.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  china_db:
