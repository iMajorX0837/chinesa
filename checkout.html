<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - Bulls</title>
    <link rel="shortcut icon" type="image/png" href="images/LOGO-STARBULLS.png">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="checkout-header">
        <a href="/index.html" id="btnVoltar"></a>
        <h1>Finalizar Pedido</h1>
    </header>

    <div class="checkout-container">
        <div class="checkout-steps">
            <div class="step-indicator active" id="step1"></div>
            <div class="step-indicator" id="step2"></div>
        </div>

        <!-- Etapa 1: Dados de entrega -->
        <div class="checkout-panel active" id="panelDados">
            <div class="checkout-card">
                <h2><span class="card-title-icon" id="iconDados"></span> Seus dados</h2>
                <form id="checkoutForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>Nome completo <span class="required">*</span></label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" data-required="true" required>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp <span class="required">*</span></label>
                        <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" data-required="true" required>
                    </div>
                    <div class="form-group">
                        <label>CPF <span class="required">*</span></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" data-required="true" required>
                    </div>
                    <div class="form-group">
                        <label>CEP <span class="required">*</span></label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" data-required="true" required>
                    </div>
                    <div class="form-group">
                        <label>Endereço <span class="required">*</span></label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, Avenida..." data-required="true" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Número <span class="required">*</span></label>
                            <input type="text" id="numero" name="numero" placeholder="Nº" data-required="true" required>
                        </div>
                        <div class="form-group">
                            <label>Complemento</label>
                            <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Bairro <span class="required">*</span></label>
                        <input type="text" id="bairro" name="bairro" placeholder="Bairro" data-required="true" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cidade <span class="required">*</span></label>
                            <input type="text" id="cidade" name="cidade" placeholder="Cidade" data-required="true" required>
                        </div>
                        <div class="form-group">
                            <label>Estado <span class="required">*</span></label>
                            <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2" data-required="true" required>
                        </div>
                    </div>
                    <button type="button" class="btn-primary" id="btnContinuar">Continuar para o resumo</button>
                </form>
            </div>
        </div>

        <!-- Etapa 2: Resumo e pagamento -->
        <div class="checkout-panel" id="panelResumo">
            <div class="checkout-card">
                <h2><span class="card-title-icon" id="iconResumo"></span> Resumo do Pedido</h2>
                <div class="delivery-option">
                    <i class="fas fa-motorcycle delivery-icon"></i>
                    <div class="info">
                        <strong>Entregar Agora</strong>
                        <span>20 a 30 min</span>
                    </div>
                    <span class="badge">Grátis</span>
                </div>
            </div>

            <div class="checkout-card">
                <h2><span class="card-title-icon" id="iconCart"></span> Seu carrinho</h2>
                <div id="cartItems"></div>
                <div class="cart-total">
                    <span>Total</span>
                    <span id="cartTotal">R$ 0,00</span>
                </div>
            </div>

            <div class="checkout-card">
                <h2><span class="card-title-icon" id="iconPayment"></span> Método de Pagamento</h2>
                <p class="payment-hint">Escolha um método de pagamento...</p>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="pagamento" value="pix" checked>
                        <div class="payment-card">
                            <div class="payment-icon">
                                <img src="https://images.seeklogo.com/logo-png/50/2/pix-banco-central-brasil-logo-png_seeklogo-500502.png" alt="PIX" width="50" height="50">
                            </div>
                            <div class="payment-info">
                                <strong>PIX</strong>
                                <span>Pagamento via Pix — Aprovação imediata.</span>
                            </div>
                        </div>
                    </label>
                </div>
                <button type="button" class="btn-primary" id="btnPagar" style="margin-top:16px;">Pagar</button>
            </div>
        </div>
    </div>

    <!-- Modal PIX -->
    <div class="pix-modal" id="pixModal">
        <div class="pix-modal-content">
            <img src="https://images.seeklogo.com/logo-png/50/2/pix-banco-central-brasil-logo-png_seeklogo-500502.png" alt="PIX" class="pix-logo" width="80" height="80">
            <h3>Pagamento via PIX</h3>
            <p class="order-number" id="orderNumber"></p>
            <img id="pixQrCode" class="pix-qr" alt="QR Code PIX" hidden>
            <p>Escaneie o QR Code ou copie o código PIX abaixo para confirmar seu pedido.</p>
            <div class="pix-key-box" id="pixKey"></div>
            <button class="btn-copy" id="btnCopyPix"><span id="iconCopy"></span> Copiar código PIX</button>
            <button class="btn-close-modal" id="btnCloseModal">Já realizei o pagamento</button>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.mask.min.js"></script>
    <script src="js/precos.js"></script>
    <script src="js/checkout-icons.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
