date.timezone = America/Sao_Paulo
output_buffering = 4096
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 5000
display_errors = Off
log_errors = On
error_log = /var/log/apache2/php-error.log
session.cookie_httponly = 1
session.cookie_samesite = Lax
