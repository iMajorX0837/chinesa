name: chinesa

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-china}
      DB_PASS: ${DB_PASS:-china}
      DB_NAME: ${DB_NAME:-china}
      VIRTUAL_HOST: 993pix.com,www.993pix.com
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: 993pix.com,www.993pix.com
    labels:
      - traefik.enable=true
      - traefik.http.routers.chinesa.rule=Host(`993pix.com`) || Host(`www.993pix.com`)
      - traefik.http.routers.chinesa.entrypoints=websecure
      - traefik.http.routers.chinesa.tls.certresolver=letsencrypt
      - traefik.http.services.chinesa.loadbalancer.server.port=80
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-china}
      MYSQL_USER: ${DB_USER:-china}
      MYSQL_PASSWORD: ${DB_PASS:-china}
      TZ: America/Sao_Paulo
    volumes:
      - china_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  china_db:
